<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chaos N Giggle</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

height:100vh;

background:linear-gradient(135deg,#0f172a,#111827,#1e293b);

overflow:hidden;

display:flex;

justify-content:center;

align-items:center;

}

.container{

width:100%;

height:100%;

display:flex;

flex-direction:column;

background:#111827;

}

.header{

height:80px;

background:#0f172a;

display:flex;

align-items:center;

justify-content:center;

flex-direction:column;

box-shadow:0 2px 15px rgba(0,0,0,.4);

}

.header h1{

color:#00e5ff;

font-size:28px;

}

.header p{

color:#94a3b8;

font-size:13px;

}

#chat{

flex:1;

padding:25px;

overflow-y:auto;

display:flex;

flex-direction:column;

gap:15px;

}

.bot{

align-self:flex-start;

background:#1e293b;

padding:15px;

border-radius:20px 20px 20px 5px;

color:white;

max-width:75%;

}

.user{

align-self:flex-end;

background:#06b6d4;

padding:15px;

border-radius:20px 20px 5px 20px;

color:white;

max-width:75%;

}

.bottom{

padding:18px;

display:flex;

gap:15px;

background:#0f172a;

}

#message{

flex:1;

padding:16px;

border:none;

outline:none;

border-radius:15px;

background:#1e293b;

color:white;

font-size:16px;

}

button{

padding:16px 28px;

background:#06b6d4;

color:white;

font-size:16px;

border:none;

border-radius:15px;

cursor:pointer;

transition:.3s;

}

button:hover{

background:#0891b2;

transform:scale(1.05);

}

.typing{

color:#94a3b8;

font-style:italic;

}

</style>

</head>

<body>

<div class="container">

<div class="header">

<h1>🤪 Chaos N Giggle</h1>

<p>Where Chaos Meets Intelligence</p>

</div>

<div id="chat">

<div class="bot">

👋 Hello! I'm Chaos N Giggle.

Ask me anything 😎

</div>

</div>

<div class="bottom">

<input

id="message"

type="text"

placeholder="Type your message..."

autocomplete="off"

>

<button onclick="sendMessage()">

🚀 Send

</button>

</div>

</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
